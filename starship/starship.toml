# Starship prompt. Docs: https://starship.rs/config
# ~/.config/starship.toml -> ~/dotfiles/starship/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

# Line 1: folder, git, toolchain, how long the last command took
# Line 2: ❯ (time on the right)
# Folder and branch are links: Cmd-click opens Finder or GitHub (prompt-link)
format = """
${custom.dir}\
${custom.branch}\
$git_state\
$git_status\
$nodejs\
$bun\
$python\
$ruby\
$docker_context\
$cmd_duration
$character"""
right_format = "$time"

# prompt-link colours its own text
[custom.dir]
command = '"$HOME/dotfiles/starship/prompt-link" dir'
when = true
shell = ["sh"]
format = "$output "

[custom.branch]
command = '"$HOME/dotfiles/starship/prompt-link" branch'
when = true
require_repo = true
shell = ["sh"]
format = "[on](overlay1) $output "

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "bold red"

[nodejs]
symbol = " "
style = "bold green"
format = "[via](overlay1) [$symbol$version]($style) "

[bun]
symbol = "🥟 "
format = "[via](overlay1) [$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = '[via](overlay1) [$symbol$version( \($virtualenv\))]($style) '

[ruby]
symbol = " "
format = "[via](overlay1) [$symbol$version]($style) "

[docker_context]
symbol = " "
only_with_files = true

[cmd_duration]
min_time = 2_000
style = "bold peach"
format = "[took](overlay1) [$duration]($style) "
# Long-command notifications come from Ghostty (notify-on-command-finish)

[time]
disabled = false
style = "overlay1"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
